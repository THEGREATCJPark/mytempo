name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Without these secrets build.sh makes a throwaway key; that APK cannot update an existing install.
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_B64" | base64 -d > signing/pulse-release.jks
            printf '%s' "$KEYSTORE_PASSWORD" > signing/.keystore-password
          else
            echo "::warning::KEYSTORE_B64 not set; signing with a temporary key."
          fi
      - name: Test
        run: bash tests/run-audio-tests.sh
      - name: Build
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mytempo
          path: dist/mytempo.apk*
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum mytempo.apk > SHA256SUMS.txt)
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 dist/mytempo.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create v2.0.0 dist/mytempo.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "mytempo 2.0" --notes-file RELEASE_NOTES.md --latest
          fi
