name: Build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null'
      - name: Test
        run: bash tests/run-audio-tests.sh && bash tests/run-jazz-tests.sh && bash tests/run-window-tests.sh
      - name: Build test APK
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-build-temporary-signature
          path: dist/mytempo.apk
  window-ui:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null'
      - name: Build app and native instrumentation
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME" bash build.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" bash tests/build-ui-tests.sh
      - name: Enable KVM for the ephemeral test runner
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise tablet windows and actual PiP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-pip-qa-api-${{ matrix.api }}
          path: ui-artifacts/
  release:
    needs: [build, window-ui]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify official APK
        id: apk
        run: bash scripts/verify-release.sh
      - name: Publish a versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its assets unchanged."
          else
            gh release create "$TAG" downloads/mytempo.apk downloads/SHA256SUMS.txt --target "$GITHUB_SHA" --title "mytempo ${TAG#v}" --notes-file RELEASE_NOTES.md --latest
          fi
